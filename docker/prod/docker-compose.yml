# BEAM Campus — production stack for the dedicated box (beam-campus.net)
#
# Minimal, SQLite-backed: the site + Caddy (automatic Let's Encrypt). No
# Postgres — the site uses a SQLite file on the `site-data` volume. Hanko is
# deferred (see ROADMAP.md) and not part of this stack.
#
#   cd docker/prod
#   cp .env.example .env      # SECRET_KEY_BASE + Mailgun (optional for v1)
#   docker compose up -d --build
#
# Caddy provisions and renews Let's Encrypt certs for SITE_ADDRESS on 80/443.

services:
  site:
    build:
      context: ../..
      dockerfile: Dockerfile.prod
    image: ghcr.io/beam-campus/beam-campus-net:latest
    container_name: beam-campus-site
    hostname: site
    restart: unless-stopped
    environment:
      PORT: "4000"
      PHX_HOST: "${PHX_HOST:-beam-campus.net}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}"
      BEAM_CAMPUS_DB_PATH: "/data/beam_campus.db"
      # Mailgun (optional until the contact slice ships)
      BEAM_CAMPUS_MAILGUN_API_KEY: "${BEAM_CAMPUS_MAILGUN_API_KEY:-}"
      BEAM_CAMPUS_MAILGUN_DOMAIN: "${BEAM_CAMPUS_MAILGUN_DOMAIN:-mg.beam-campus.net}"
      BEAM_CAMPUS_MAILGUN_BASE_URL: "${BEAM_CAMPUS_MAILGUN_BASE_URL:-https://api.eu.mailgun.net}"
      BEAM_CAMPUS_CONTACT_EMAIL: "${BEAM_CAMPUS_CONTACT_EMAIL:-raf.lefever@erlef.org}"

      # ── The mesh readers ──────────────────────────────────────────────
      #
      # ⚠ WITHOUT THESE, THREE WORKBENCH PAGES RENDER THEIR "NOT CONFIGURED"
      # STATE AND NOTHING IN THIS REPOSITORY EXPLAINS WHY. They were absent
      # here for as long as those pages have existed, which means the live
      # site's mesh readers work only because somebody set the variables on
      # the box by hand, and a re-provision from this file would have lost
      # all three silently.
      #
      # The site SUBSCRIBES and draws. It never publishes and never holds a
      # store: it is a reader of the mesh, not a participant in it.
      #
      # SEEDS HAVE NO DEFAULT, on purpose. Naming a public realm costs
      # nothing; dialling a production station from every clone does. Unset
      # means the page says so, which is a working page and not an error.
      #
      # The REALMS default because they are public by design: each is the
      # sha256 of its own name, derived rather than issued. A public web
      # container must never hold the FLEET tag, which routes sentinel
      # sightings and warden facts.
      BEAM_CAMPUS_BIOTOPE_SEEDS: "${BEAM_CAMPUS_BIOTOPE_SEEDS:-}"
      BEAM_CAMPUS_BIOTOPE_REALM: "${BEAM_CAMPUS_BIOTOPE_REALM:-}"
      BEAM_CAMPUS_SOCIETY_SEEDS: "${BEAM_CAMPUS_SOCIETY_SEEDS:-}"
      BEAM_CAMPUS_SOCIETY_REALM: "${BEAM_CAMPUS_SOCIETY_REALM:-}"
    volumes:
      - site-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: beam-campus-caddy
    hostname: caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-beam-campus.net, www.beam-campus.net}"
      SITE_UPSTREAM: "site:4000"
      ACME_EMAIL: "${ACME_EMAIL:-raf.lefever@erlef.org}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      site:
        condition: service_started

volumes:
  site-data:
  caddy-data:
  caddy-config:

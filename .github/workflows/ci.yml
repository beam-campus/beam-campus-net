name: CI

# The tests gate the image. A push to main or a v* tag builds and pushes the
# image only after the test job has passed, so a commit whose tests fail never
# reaches ghcr. Pull requests run the tests only.
#
# Push to main -> :main + :<sha> + :latest
# Push to tag  -> :vX.Y.Z + :vX.Y
# amd64 only: the box is x86_64. The image goes to ghcr.io/beam-campus/beam-campus-net
# with the Actions-provided GITHUB_TOKEN (packages: write).
#
# THE IMAGE IS SIGNED AFTER IT IS PUSHED (macula-fleet#55). The `attest` job calls
# macula-ci-images' attest-image.yml at a pinned commit sha, which signs the pushed DIGEST
# keyless and attests its SBOM and provenance, exactly as every other image the fleet runs
# is signed. Without it the box on beam-campus.net could not verify what it runs and could
# not leave SIGNATURES=audit. A push to main is therefore NOT the deploy: the box runs the
# digest pinned in macula-io/macula-fleet (vps/beam-campus-net/docker-compose.yml), and a
# reviewed commit there is what moves it. Watchtower is gone from that box (2026-10-14).
#
# EVERY ACTION IS PINNED BY FULL COMMIT SHA (macula-fleet#55). They used to float on their
# major tags (@v4, @v1, @v3, @v5). A moved or compromised tag could then run someone else's
# build-push action, push an image of their choosing, and have it SIGNED as
# beam-campus/beam-campus-net: the digest attest signs is the digest the build pushed, so a
# signature is only as trustworthy as the code that built it. Each sha below is the commit
# its major tag named on 2026-10-27; there is no other change from that ref.
#
# A v* tag is signed only if the tag names the version this repository publishes, and the
# COMMITTED tree publishes none: attest-image.yml's guard reads version sources at the
# REPOSITORY ROOT, and the commit holds none there -- package.json is gitignored (it is the
# asset tooling's, kept out of the tree) and the mix projects live under system/, which the
# guard does not read. So a tag run is refused with "REFUSED, v1.0.0 names a release but .
# holds no version". Main pushes are signed regardless, which is what the fleet pins.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# The default token is read-only. Only the image job, which pushes to ghcr,
# asks for more.
permissions:
  contents: read

# One run per ref, cancelled at push time: a newer push cancels an older run,
# its tests and its image build included, so an older commit's image never
# overwrites a newer commit's :main or :latest, whatever order the tests finish in.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile, format, test
    runs-on: ubuntu-latest

    # The site uses SQLite — no database service needed in CI.
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.4.3"

      - name: Cache deps and _build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            system/deps
            system/_build
          key: ${{ runner.os }}-otp-28.4.3-mix-${{ hashFiles('system/**/mix.exs') }}
          restore-keys: ${{ runner.os }}-otp-28.4.3-mix-

      - name: Install dependencies
        working-directory: system
        run: mix deps.get

      - name: Compile (warnings as errors)
        working-directory: system
        run: mix compile --warnings-as-errors

      - name: Check formatting
        working-directory: system
        run: mix format --check-formatted

      # Credo is the Elixir counterpart to elvis/rebar3_lint on the Erlang
      # repos. Config and rule parity are documented in system/.credo.exs.
      - name: Lint (credo)
        working-directory: system
        run: mix credo --strict

      - name: Run tests
        working-directory: system
        run: mix test

      # ⚠ RENDER THE CHARTS AND MEASURE THEM. Unit tests check that the numbers
      # are right; this checks that the picture is. Twice in one day this page
      # shipped a chart whose arithmetic passed and whose image showed nothing,
      # and both times a human found it by looking.
      - name: Charts
        working-directory: system
        run: mix charts.check

  image:
    name: Build & Push (amd64)
    needs: test
    # Only main and v* tags get image tags from the metadata step, so only they
    # build. A pull request never builds an image.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The digest the build pushed, so the attest job signs exactly those bytes.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/beam-campus/beam-campus-net

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          provenance: false
          build-args: |
            CACHE_BUST=${{ github.sha }}

  # Sign the digest the build pushed, and attest its SBOM and provenance (macula-fleet#55).
  # The identity a box checks is macula-ci-images' attest-image.yml at a guarded commit,
  # called from THIS repository, for THIS digest: a build from anywhere else does not pass,
  # and the digest a box runs is the one our CI signed. Pinned by full commit sha, never
  # @main: the signing identity is that file at the ref named here.
  attest:
    name: Sign, SBOM & provenance
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@fa59fba58d1b65dce35f8613dcb257273a0f29ed
    with:
      image: ghcr.io/beam-campus/beam-campus-net
      digest: ${{ needs.image.outputs.digest }}

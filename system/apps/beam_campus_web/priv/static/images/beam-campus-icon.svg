<?xml version="1.0" encoding="UTF-8"?>
<!-- BEAM Campus · Concept A "The Beam" · icon · dark ground
     A beam of light sweeps across a field of equal peer-nodes and lights
     them along its path. No central hub (commons = no owner). One node
     buds green — evolution. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="a-beam" x1="8" y1="92" x2="86" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD989" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#F2B142" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2B142" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD989" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F2B142" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- beam wedge -->
  <polygon points="10,94 60,4 96,50" fill="url(#a-beam)"/>
  <!-- bright core ray -->
  <line x1="12" y1="90" x2="78" y2="18" stroke="#FFD989" stroke-width="1.4" stroke-linecap="round" opacity="0.85"/>

  <!-- commons mesh links (equal peers, no hub) -->
  <g stroke="#24384D" stroke-width="1" fill="none" opacity="0.9">
    <line x1="24" y1="30" x2="46" y2="24"/>
    <line x1="46" y1="24" x2="70" y2="30"/>
    <line x1="24" y1="30" x2="34" y2="56"/>
    <line x1="46" y1="24" x2="52" y2="50"/>
    <line x1="70" y1="30" x2="78" y2="56"/>
    <line x1="34" y1="56" x2="52" y2="50"/>
    <line x1="52" y1="50" x2="78" y2="56"/>
    <line x1="34" y1="56" x2="40" y2="78"/>
    <line x1="52" y1="50" x2="64" y2="76"/>
    <line x1="78" y1="56" x2="64" y2="76"/>
  </g>
  <!-- lit links along the beam -->
  <g stroke="#F2B142" stroke-width="1.4" fill="none" opacity="0.8">
    <line x1="34" y1="56" x2="52" y2="50"/>
    <line x1="46" y1="24" x2="52" y2="50"/>
  </g>

  <!-- dim off-beam peers -->
  <g stroke="#3A5068" stroke-width="1.6" fill="#0F1C2B">
    <circle cx="24" cy="30" r="4"/>
    <circle cx="70" cy="30" r="4"/>
    <circle cx="78" cy="56" r="4"/>
    <circle cx="40" cy="78" r="4"/>
  </g>

  <!-- lit peers on the beam (amber) -->
  <g>
    <circle cx="46" cy="24" r="9" fill="url(#a-glow)"/>
    <circle cx="52" cy="50" r="11" fill="url(#a-glow)"/>
    <circle cx="34" cy="56" r="8" fill="url(#a-glow)"/>
  </g>
  <g stroke="#FFD989" stroke-width="2" fill="#F2B142">
    <circle cx="46" cy="24" r="4.5"/>
    <circle cx="52" cy="50" r="5.5"/>
    <circle cx="34" cy="56" r="4"/>
  </g>

  <!-- budding node: evolution (green) with offshoot -->
  <line x1="64" y1="76" x2="80" y2="86" stroke="#5FD08A" stroke-width="1.6" opacity="0.9"/>
  <circle cx="64" cy="76" r="4" fill="#0F1C2B" stroke="#5FD08A" stroke-width="2"/>
  <circle cx="80" cy="86" r="2.6" fill="#5FD08A"/>
</svg>
